{% extends "base.html" %}
{% block content %}

<h2>Edit Product #{{ product.product_id }}</h2>

<form method="post" enctype="multipart/form-data" class="mt-3" style="max-width: 500px;">

  <input type="hidden" name="current_image_url" value="{{ product.image_url or '' }}">

  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" value="{{ product.name }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Price (KGS)</label>
    <input name="price" type="number" step="0.01" class="form-control"
           value="{{ product.price }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Stock</label>
    <input name="stock" type="number" class="form-control"
           value="{{ product.stock_qty }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Category</label>
    <select name="category_id" class="form-select">
      <option value="">-- No category --</option>
      {% for c in categories %}
        <option value="{{ c.category_id }}"
                {% if product.category_id == c.category_id %}selected{% endif %}>
          {{ c.name }}
        </option>
      {% endfor %}
    </select>
  </div>

  {% if product.image_url %}
  <div class="mb-3">
    <label class="form-label">Current image</label><br>
    <img src="{{ url_for('static', filename=product.image_url) }}"
         alt="Product image"
         style="max-width: 200px; border: 1px solid #ddd; padding: 4px;">
  </div>
  {% endif %}

  <div class="mb-3">
    <label class="form-label">Upload New Image (optional)</label>
    <input type="file" name="image_file" class="form-control" accept=".png,.jpg,.jpeg,.gif,.webp">
    <div class="form-text">If uploaded, it replaces the current image.</div>
  </div>

  <div class="mb-3">
    <label class="form-label">Image URL (optional)</label>
    <input name="image_url" class="form-control"
           value="{{ product.image_url or '' }}">
    <div class="form-text">Leave empty to keep current image.</div>
  </div>

  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control"
              rows="3">{{ product.description }}</textarea>
  </div>

  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="is_active" name="is_active"
           {% if product.is_active %}checked{% endif %}>
    <label class="form-check-label" for="is_active">
      Active
    </label>
  </div>

  <button class="btn btn-primary">Save changes</button>
  <a href="{{ url_for('admin_products') }}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
