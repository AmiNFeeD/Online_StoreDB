{% extends "base.html" %}
{% block content %}

<h2>Edit Category #{{ category.category_id }}</h2>

<form method="post" class="mt-3" style="max-width: 500px;">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" value="{{ category.name }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="3">
{{ category.description or '' }}</textarea>
  </div>

  <button class="btn btn-primary">Save changes</button>
  <a href="{{ url_for('admin_categories') }}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
