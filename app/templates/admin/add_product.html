{% extends "base.html" %}
{% block content %}

<h2>Add Product</h2>

<form method="post" enctype="multipart/form-data" class="mt-3" style="max-width: 500px;">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Price (KGS)</label>
    <input name="price" type="number" step="0.01" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Stock</label>
    <input name="stock" type="number" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Category</label>
    <select name="category_id" class="form-select">
      <option value="">-- No category --</option>
      {% for c in categories %}
        <option value="{{ c.category_id }}">{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Upload Image (optional)</label>
    <input type="file" name="image_file" class="form-control" accept=".png,.jpg,.jpeg,.gif,.webp">
    <div class="form-text">If you upload a file, it will be used instead of Image URL.</div>
  </div>

  <div class="mb-3">
    <label class="form-label">Image URL (optional)</label>
    <input name="image_url" class="form-control">
  </div>

  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control"></textarea>
  </div>

  <button class="btn btn-success">Save</button>
  <a href="{{ url_for('admin_products') }}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
