{% extends "base.html" %}
{% block content %}

<h2>Categories</h2>

<a href="{{ url_for('admin_add_category') }}" class="btn btn-success mb-3">
  Add Category
</a>

<table class="table table-bordered table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Description</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
  {% for c in categories %}
    <tr>
      <td>{{ c.category_id }}</td>
      <td>{{ c.name }}</td>
      <td>{{ c.description }}</td>
      <td>
        <a href="{{ url_for('admin_edit_category', category_id=c.category_id) }}"
           class="btn btn-sm btn-primary">Edit</a>

        <form method="post"
              action="{{ url_for('admin_delete_category', category_id=c.category_id) }}"
              style="display:inline-block"
              onsubmit="return confirm('Delete this category?');">
          <button type="submit" class="btn btn-sm btn-danger">Delete</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>

{% endblock %}
