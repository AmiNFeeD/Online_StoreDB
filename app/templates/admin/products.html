{% extends "base.html" %}
{% block content %}

<h2>Products</h2>

<a href="{{ url_for('admin_add_product') }}" class="btn btn-success mb-3">
  Add Product
</a>

<table class="table table-bordered table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Stock</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
  {% for p in products %}
    <tr>
      <td>{{ p.product_id }}</td>
      <td>{{ p.name }}</td>
      <td>{{ p.price }} KGS</td>
      <td>{{ p.stock_qty }}</td>
      <td>{{ 'Active' if p.is_active else 'Disabled' }}</td>
      <td>
        <a href="{{ url_for('admin_edit_product', product_id=p.product_id) }}"
           class="btn btn-sm btn-primary">
          Edit
        </a>

        <form method="post"
              action="{{ url_for('admin_delete_product', product_id=p.product_id) }}"
              style="display:inline-block"
              onsubmit="return confirm('Delete this product?');">
          <button type="submit" class="btn btn-sm btn-danger">
            Delete
          </button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>

{% endblock %}
