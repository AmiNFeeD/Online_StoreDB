{% extends "base.html" %}
{% block content %}

<h2>Your Orders</h2>

<table class="table table-bordered table-striped mt-3">
  <thead>
    <tr>
      <th>Order #</th>
      <th>Status</th>
      <th>Total</th>
      <th>Created At</th>
    </tr>
  </thead>
  <tbody>
  {% for o in orders %}
    <tr>
      <td>
        <a href="{{ url_for('order_detail', order_id=o.order_id) }}">
            {{ o.order_id }}
        </a>
      </td>
      <td>{{ o.status }}</td>
      <td>{{ o.total_amount }} KGS</td>
      <td>
        {{ o.created_at.strftime('%Y-%m-%d %H:%M') if o.created_at is not string else o.created_at }}
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>

{% endblock %}
